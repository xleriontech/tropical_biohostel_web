<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión · Tropical Biohostel</title>
    <meta name="theme-color" content="#007A33" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --fondo: #f5efe0;
        --verde: #007a33;
        --verde-oscuro: #184e40;
        --texto: #2b2119;
        --tenue: #6b5d4c;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        background: var(--fondo);
        color: var(--texto);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      .card {
        max-width: 30rem;
        background: #fff;
        border-radius: 1.25rem;
        padding: 2.5rem 2rem;
        box-shadow: 0 10px 40px rgba(24, 78, 64, 0.10);
      }
      .logo { width: 92px; height: 92px; margin: 0 auto 1.25rem; display: block; }
      h1 { font-size: 1.6rem; margin: 0 0 0.5rem; letter-spacing: -0.01em; }
      p { color: var(--tenue); line-height: 1.6; margin: 0 0 1.75rem; }
      .acciones { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; }
      a.boton {
        display: inline-block;
        padding: 0.7rem 1.5rem;
        border-radius: 999px;
        background: var(--verde);
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.95rem;
      }
      a.boton.secundario {
        background: transparent;
        color: var(--verde-oscuro);
        border: 1px solid rgba(0, 122, 51, 0.35);
      }
      .firma { margin-top: 2rem; font-size: 0.8rem; color: var(--tenue); }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="logo" src="/icons/icon-192.png?v=2" alt="" width="92" height="92" />
      <h1>Estás sin conexión</h1>
      <p>
        No pudimos alcanzar el servidor. Las páginas que ya visitaste siguen disponibles, y en
        cuanto vuelva la internet podrás continuar con tu reserva.
      </p>
      <div class="acciones">
        <a class="boton" href="/">Ir al inicio</a>
        <a class="boton secundario" href="/rutas">Ver las rutas del café</a>
      </div>
      <p class="firma">Tropical Biohostel · Nocaima, Cundinamarca</p>
    </main>
  </body>
</html>
