services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: turismo_user
      POSTGRES_PASSWORD: ${TURISMO_PG_PASSWORD:?definir en .env}
      POSTGRES_DB: turismo_db
    ports:
      - "127.0.0.1:${PG_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - turismo-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turismo_user -d turismo_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?definir en .env}"]
    networks:
      - turismo-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env.docker
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - turismo-net

volumes:
  postgres_data:

networks:
  turismo-net:
    driver: bridge
